<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Moon orbit concept</title>
<style>
  :root {
    --bg: #04040a;
    --violet: #7c6fee;
    --pink: #ff5ea8;
    --gold: #f5c453;
    --text: #f0eefc;
    --text-faint: #6b688f;
  }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 520px;
  }
  .avatar {
    position: absolute;
    top: 50%; left: 50%;
    width: 130px; height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #14101f, #04040a 70%);
    box-shadow: 0 0 50px rgba(124,111,238,0.35), 0 0 100px rgba(124,111,238,0.15);
    transform: translate(-50%, -50%);
  }
  .moon {
    position: absolute;
    top: 50%; left: 50%;
    width: 40px; height: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .crescent {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #f0eefc;
    position: relative;
    box-shadow: 0 0 14px rgba(124,111,238,0.45);
    animation: drift 7s ease-in-out infinite;
  }
  .crescent::after {
    content: "";
    position: absolute;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--bg);
    top: 3px; left: 11px;
  }
  .label {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    white-space: nowrap;
  }
  @keyframes drift {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .streak {
    position: absolute;
    width: 2px;
    height: 140px;
    background: linear-gradient(to bottom, transparent, rgba(124,111,238,0.85), transparent);
    opacity: 0;
    filter: blur(0.5px);
  }
  .s1 { top: 6%; left: 22%; transform: rotate(24deg); animation: sweep 9s ease-in-out infinite; }
  .s2 { top: 58%; left: 74%; transform: rotate(-16deg); animation: sweep 11s ease-in-out infinite 3.5s; }
  .s3 { top: 12%; left: 68%; transform: rotate(-30deg); animation: sweep 13s ease-in-out infinite 7s; }
  @keyframes sweep {
    0%, 100% { opacity: 0; }
    45% { opacity: 0; }
    55% { opacity: 1; }
    70% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="streak s1"></div>
  <div class="streak s2"></div>
  <div class="streak s3"></div>
  <div class="avatar"></div>

  <div class="moon" style="transform: translate(calc(-50% + 0px), calc(-50% + -180px));">
    <div class="crescent"></div>
    <div class="label">YT MAIN</div>
  </div>
  <div class="moon" style="transform: translate(calc(-50% + 171px), calc(-50% + -56px));">
    <div class="crescent" style="animation-delay: -1.5s;"></div>
    <div class="label">YT EN</div>
  </div>
  <div class="moon" style="transform: translate(calc(-50% + 106px), calc(-50% + 146px));">
    <div class="crescent" style="animation-delay: -3s;"></div>
    <div class="label">TIKTOK</div>
  </div>
  <div class="moon" style="transform: translate(calc(-50% + -106px), calc(-50% + 146px));">
    <div class="crescent" style="animation-delay: -4.5s;"></div>
    <div class="label">FACEBOOK</div>
  </div>
  <div class="moon" style="transform: translate(calc(-50% + -171px), calc(-50% + -56px));">
    <div class="crescent" style="animation-delay: -6s;"></div>
    <div class="label">DISCORD</div>
  </div>
</div>
</body>
</html>
